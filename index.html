<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selector Detective</title>
  <link rel="stylesheet" href="css/task1.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="Js/task1.js" defer></script>
</head>
<body>
  <nav id="navbar">
    <a href="index.html" class="active">Task 1: Selector Detective</a>
    <a href="task2.html">Task 2: The party in motion</a>
  </nav>

  <h1>The Party, 19:30 - 22:30</h1>

  <!-- the house is built by JS from the array -->
  <div id="roof"></div>
  <div id="house">
    <div class="floor">
      <div class="floor-label">Floor 2</div>
      <div class="rooms" id="floor-2"></div>
    </div>
    <div class="floor">
      <div class="floor-label">Floor 1</div>
      <div class="rooms" id="floor-1"></div>
    </div>
  </div>

  <!-- result of the case -->
  <div id="result">Click a case button</div>

  <!-- one button for every case -->
  <div id="buttons">
    <button data-case="1">1. Who is in the hall?</button>
    <button data-case="2">2. Yellow or purple</button>
    <button data-case="3">3. AITU upstairs</button>
    <button data-case="4">4. Glasses or bag</button>
    <button data-case="5">5. Came with nothing</button>
    <button data-case="6">6. Phone, no bag</button>
    <button data-case="7">7. Arrived 20:30-21:00</button>
    <button data-case="8">8. After 21:00, not AITU</button>
    <button data-case="9">9. Next to Askar</button>
    <button data-case="10">10. Last in each room</button>
    <button data-case="11">11. Third in each room</button>
    <button data-case="12">12. After Timur</button>
    <button data-case="13">13. Before someone in black</button>
    <button data-case="14">14. Room of Aruzhan</button>
    <button data-case="15">15. Rooms with &lt; 6 guests</button>
    <button data-case="16">16. Cup, no glasses</button>
    <button data-case="17">17. First in each room</button>
    <button data-case="18">18. Miras comes</button>
    <button data-case="19">19. Natasha leaves</button>
    <button data-case="20">20. Who took the cake?</button>
  </div>

  
</body>
</html>
